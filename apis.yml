name: ElasticRun
description: 'ElasticRun (legally NTEx Transportation Services Pvt Ltd) is a Pune,
  India based B2B e-commerce and rural logistics platform founded in 2016 by Sandeep
  Deshmukh, Saurabh Nigam and Shitiz Bansal. It operates an aggregated, variable-capacity
  transportation network that stitches together idle logistics capacity to connect
  FMCG brands and manufacturers to the mom-and-pop kirana stores of rural and semi-urban
  India. The platform blends mobile technology with local entrepreneurs to run an
  assisted-commerce model spanning 125,000+ kiranas and 80,000+ villages across 26
  states, offering last-mile delivery, B2B distribution and supply-chain services.
  ElasticRun is backed by Prosus Ventures and SoftBank Vision Fund. This profile is
  a network stub: no public developer API, documentation or SDKs were found during
  enrichment.'
